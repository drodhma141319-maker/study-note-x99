<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悉曇心性書法靜修營｜依《梵字必携》正統筆順</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Siddham&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "Noto Sans Siddham";
      src: url("./fonts/NotoSansSiddham-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #f6f1e7;
      --card: #fffdf9;
      --ink: #2c241e;
      --subink: #5c5046;
      --cinnabar: #9e2a2b;
      --cinnabar-bg: #fdf2f2;
      --gold: #8c6239;
      --gold-bg: #f7efe2;
      --jade: #2d6a4f;
      --jade-bg: #e8f3ee;
      --border: #d8ccb8;
    }
    body {
      font-family: "Noto Serif TC", -apple-system, BlinkMacSystemFont, serif;
      background-color: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 1.8rem 1rem 4.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.7;
    }
    header { text-align: center; max-width: 820px; margin-bottom: 1.2rem; }
    .seal-badge {
      display: inline-block;
      border: 2px solid var(--cinnabar);
      color: var(--cinnabar);
      font-weight: 900;
      font-size: 0.95rem;
      padding: 2px 12px;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }
    h1 { font-size: 1.85rem; margin: 0 0 0.5rem; color: var(--ink); letter-spacing: 1px; }
    .subtitle { font-size: 1.08rem; color: var(--subink); margin: 0; }

    .top-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 1.4rem;
      width: 100%;
      max-width: 820px;
    }
    .nav-btn {
      flex: 1;
      padding: 14px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card);
      font-family: "Noto Serif TC", serif;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--subink);
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: var(--cinnabar);
      color: #fff;
      border-color: var(--cinnabar);
      box-shadow: 0 4px 12px rgba(158, 42, 43, 0.2);
    }

    .stage-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 840px; margin-bottom: 1.4rem; }
    .stage-btn {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 16px; font-family: "Noto Serif TC", serif; font-size: 1.05rem; font-weight: 700; color: var(--subink);
      cursor: pointer; transition: all 0.2s;
    }
    .stage-btn:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .stage-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }
    .stage-btn.done::after { content: " 🪷"; }

    .panel {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 18px;
      padding: 1.8rem; width: 100%; max-width: 820px; box-shadow: 0 6px 18px rgba(44, 36, 30, 0.06); box-sizing: border-box;
    }

    .mode-switch { display: flex; gap: 12px; margin-bottom: 1.4rem; border-bottom: 1.5px solid var(--border); padding-bottom: 1.2rem; }
    .mode-tab {
      flex: 1; padding: 14px 10px; border-radius: 12px; border: 1.5px solid var(--border);
      background: #f3ede2; font-family: "Noto Serif TC", serif; font-size: 1.12rem; font-weight: 700; cursor: pointer; text-align: center; color: var(--subink);
    }
    .mode-tab.active { background: var(--gold-bg); border-color: var(--gold); color: var(--ink); }

    .wisdom-banner {
      background: var(--gold-bg); border-left: 5px solid var(--gold); border-radius: 10px;
      padding: 14px 18px; margin-bottom: 1.3rem; font-size: 1.08rem; color: var(--ink); line-height: 1.75;
    }

    .learn-list { display: flex; flex-direction: column; gap: 16px; }
    .learn-card {
      display: flex; align-items: center; gap: 20px; border: 1.5px solid var(--border);
      border-radius: 14px; padding: 18px 20px; cursor: pointer; transition: all 0.2s; background: #fff;
    }
    .learn-card:hover { border-color: var(--cinnabar); background: #fffaf5; }
    .learn-card.playing { background: var(--cinnabar-bg); border-color: var(--cinnabar); }
    .char-box {
      min-width: 115px; text-align: center; background: #f6f1e7; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 10px;
    }
    .siddham-large { font-family: "Noto Sans Siddham", serif; font-size: 3.6rem; line-height: 1.25; color: var(--ink); }
    .siddham-mantra { font-family: "Noto Sans Siddham", serif; font-size: 2.1rem; line-height: 1.35; color: var(--ink); }
    .roman-large { font-size: 1.3rem; font-weight: 800; color: var(--cinnabar); margin-top: 6px; font-family: sans-serif; }
    .info-box { flex: 1; }
    .dharma-title { font-size: 1.25rem; font-weight: 900; color: var(--cinnabar); margin-bottom: 4px; }
    .brush-text { font-size: 1.05rem; color: var(--ink); line-height: 1.6; }
    .stroke-order-tag {
      margin-top: 8px;
      background: #f3ede2;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.98rem;
      color: #4a3b2c;
      font-weight: 700;
      line-height: 1.55;
    }
    .card-actions { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .mini-btn {
      background: var(--gold-bg); border: 1px solid var(--gold); color: var(--ink);
      border-radius: 8px; padding: 8px 14px; font-family: "Noto Serif TC", serif; font-size: 0.98rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .mini-btn:hover { background: var(--gold); color: #fff; }
    .mini-btn.cinnabar { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
    .mini-btn.cinnabar:hover { background: #7f1d1d; }

    /* 靜心書法描紅區 */
    .calligraphy-box {
      margin-top: 1.8rem;
      background: #f9f5ed;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
    }
    .stroke-guide-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin: 10px auto;
      max-width: 580px;
      font-size: 1.05rem;
      color: var(--ink);
    }
    .canvas-wrap {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 14px auto;
      background: #fffdf9;
      border: 2px solid var(--cinnabar);
      border-radius: 12px;
      box-shadow: inset 0 0 15px rgba(158, 42, 43, 0.08);
      touch-action: none;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(158,42,43,0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(158,42,43,0.12) 1px, transparent 1px);
      background-size: 140px 140px;
      pointer-events: none;
    }
    .watermark-char {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans Siddham", serif;
      font-size: 11rem;
      color: rgba(158, 42, 43, 0.13);
      pointer-events: none;
      user-select: none;
    }
    canvas#demoCanvas, canvas#traceCanvas {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 10px;
    }
    canvas#demoCanvas { z-index: 2; pointer-events: none; }
    canvas#traceCanvas { z-index: 3; cursor: crosshair; }

    .primary-btn {
      width: 100%; margin-top: 1.5rem; padding: 16px; background: var(--cinnabar); color: #fff;
      border: none; border-radius: 12px; font-family: "Noto Serif TC", serif; font-size: 1.2rem; font-weight: 700; cursor: pointer;
    }
    .primary-btn:hover { background: #7f1d1d; }

    /* 品茗印心練習區 */
    .step-ladder {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.3rem;
    }
    .step-pill {
      padding: 12px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f6f1e7;
      font-family: "Noto Serif TC", serif;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--subink);
      cursor: pointer;
      text-align: center;
    }
    .step-pill.active { background: var(--gold-bg); border-color: var(--gold); color: var(--ink); }
    .step-pill.cleared { background: var(--jade-bg); border-color: var(--jade); color: var(--jade); }

    .question-box { text-align: center; padding: 1.6rem 1.2rem; background: #f9f5ed; border-radius: 14px; margin-bottom: 1.3rem; border: 1px solid var(--border); }
    .q-prompt { font-size: 1.25rem; font-weight: 700; color: var(--ink); margin-bottom: 0.8rem; }
    .q-display-char { font-family: "Noto Sans Siddham", serif; font-size: 4.5rem; line-height: 1.25; color: var(--ink); margin: 0.4rem 0; word-break: break-all; }
    .audio-replay-btn {
      background: var(--gold); color: #fff; border: none; border-radius: 999px;
      padding: 12px 26px; font-family: "Noto Serif TC", serif; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem;
    }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .opt-btn {
      background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 16px 14px;
      cursor: pointer; font-family: "Noto Serif TC", serif; font-size: 1.15rem; font-weight: 700; color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 78px; text-align: center; line-height: 1.45;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--cinnabar); background: #fffaf5; }
    .opt-btn .siddham-opt { font-family: "Noto Sans Siddham", serif; font-size: 2.8rem; }
    .opt-btn.correct { background: var(--jade-bg); border-color: var(--jade); color: #1b4332; }
    .opt-btn.wrong { background: var(--cinnabar-bg); border-color: var(--cinnabar); color: var(--cinnabar); }
    .feedback-box { margin-top: 1.3rem; padding: 16px 18px; border-radius: 12px; font-size: 1.08rem; line-height: 1.65; display: none; }
    .feedback-box.ok { background: var(--jade-bg); color: #1b4332; border: 1px solid #95d5b2; }
    .feedback-box.err { background: var(--cinnabar-bg); color: #7f1d1d; border: 1px solid #f5c2c7; }

    .week-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; background: #fff; }
    .week-title { font-weight: 900; color: var(--cinnabar); font-size: 1.15rem; margin-bottom: 10px; }
    .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px; border-bottom: 1px dashed var(--border); cursor: pointer; }
    .task-item:last-child { border-bottom: none; }
    .task-item input[type="checkbox"] { width: 22px; height: 22px; margin-top: 4px; accent-color: var(--jade); cursor: pointer; }
    .task-text { flex: 1; font-size: 1.08rem; }
    .task-item.checked .task-text { text-decoration: line-through; color: #9c8f80; }

    @media (max-width: 600px) {
      .options-grid { grid-template-columns: 1fr; }
      .step-ladder { grid-template-columns: 1fr; }
      .learn-card { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="seal-badge">依《梵字必携》智滿流正統筆順</div>
    <h1>悉曇心性書法靜修營</h1>
    <p class="subtitle">起筆先打「阿字命點」・以義帶音・以音顯形・全43字母動態筆順臨摹</p>
  </header>

  <div class="top-nav">
    <button class="nav-btn active" id="navGame" onclick="switchTopTab('game')">🪷 靜心賞字與正統筆順</button>
    <button class="nav-btn" id="navPlan" onclick="switchTopTab('plan')">🍵 每日靜修日課表</button>
  </div>

  <!-- 賞字與印心區 -->
  <div id="gameSection" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="stage-bar" id="stageBar"></div>
    <div class="panel">
      <div class="mode-switch">
        <button class="mode-tab active" id="tabLearn" onclick="setMode('learn')">🖌️ 第一步：以義帶音・智滿流筆順臨摹</button>
        <button class="mode-tab" id="tabQuiz" onclick="setMode('quiz')">🍵 第二步：品茗印心・隨堂溫習</button>
      </div>

      <div id="learnView">
        <div class="wisdom-banner" id="stageStory"></div>
        <div class="learn-list" id="learnList"></div>

        <!-- 靜心描紅硯台（依《梵字必携》正統筆順） -->
        <div class="calligraphy-box">
          <div style="font-size:1.2rem; font-weight:900; color:var(--cinnabar);">🖌️ 靜心描紅硯台（兒玉義隆《梵字必携》智滿流毛筆筆順）</div>
          <div class="stroke-guide-panel">
            <div style="font-size:1.08rem;" id="traceLabel">目前臨摹字帖：<b>𑖎 (ka)</b> — 離作業</div>
            <div style="font-size:1rem; color:var(--cinnabar); font-weight:700; margin-top:6px;" id="traceOrderText"></div>
          </div>
          <div class="canvas-wrap">
            <div class="grid-lines"></div>
            <div class="watermark-char" id="watermarkChar">𑖎</div>
            <canvas id="demoCanvas" width="280" height="280"></canvas>
            <canvas id="traceCanvas" width="280" height="280"></canvas>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px;">
            <button class="mini-btn cinnabar" id="demoBtn" onclick="playStrokeDemo()">▶️ 示範正統筆順</button>
            <button class="mini-btn" onclick="clearCanvas()">💧 清硯重寫</button>
            <button class="mini-btn" onclick="replayTraceAudio()">🔊 聆聽梵音</button>
          </div>
          <div style="font-size:0.94rem; color:var(--subink); margin-top:10px;">
            💡 <b>《梵字必携》筆法心要：</b>凡起筆處皆先頓筆打<b>「阿字命點（發心點）」</b>，順勢右推拉出橫畫，再依序運筆，最後以「鶯點」或「雲形點」收鋒。
          </div>
        </div>

        <button class="primary-btn" onclick="startQuizStep(1)">心領神會了，進入「🍵 品茗印心溫習」 ➔</button>
      </div>

      <div id="quizView" style="display:none;">
        <div class="step-ladder" id="stepLadder"></div>
        <div class="question-box">
          <div class="q-prompt" id="qPrompt"></div>
          <div class="q-display-char" id="qChar" style="display:none;"></div>
          <button class="audio-replay-btn" id="qAudioBtn" style="display:none;" onclick="replayCurrentQuestionAudio()">🔊 再次聆聽梵音</button>
        </div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="feedback-box" id="feedbackBox"></div>
        <button class="primary-btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">繼續品讀下一題 ➔</button>
      </div>
    </div>
  </div>

  <!-- 靜修日課表 -->
  <div id="planSection" class="panel" style="display:none;">
    <div class="wisdom-banner">
      <b>🪷 長輩靜修心法：</b>依兒玉義隆《梵字必携》傳承，每字起筆先打「發心命點」。每天氣定神閒花半小時，泡一壺好茶，先看一次正統筆順動畫，再慢寫三五個種子字，字義與筆勢自然會印在心田裡。
    </div>
    <div id="planContainer"></div>
  </div>

  <script>
    // 嚴格依據兒玉義隆《梵字必携 書写と解読》(P.76-178) 智滿流毛筆筆順座標庫
    const strokeAnimations = {
      // === 第一品：ka 行 (P.110-119) ===
      "𑖎": [
        // P.110 ka: ①命點→橫畫→回中心垂直下拉微挑 ②左半弧起筆向右上拱過中豎再向右下垂尾
        [[102, 86], [110, 92], [174, 82], [138, 88], [138, 178], [148, 172]],
        [[92, 168], [94, 134], [138, 118], [182, 136], [186, 176], [198, 188]]
      ],
      "𑖏": [
        // P.112 kha: ①左側上挑弧 ②左下垂筆 ③命點→橫畫→左折半月弧 ④右側長豎向右彎出
        [[106, 108], [92, 134], [74, 146]],
        [[96, 140], [104, 166], [102, 184]],
        [[106, 96], [114, 102], [186, 92], [144, 126], [136, 158], [164, 180]],
        [[172, 98], [172, 166], [194, 190]]
      ],
      "𑖐": [
        // P.114 ga: ①左側上挑弧 ②左下垂筆 ③命點→橫畫→垂直下拉向右弧收筆
        [[106, 108], [92, 134], [74, 146]],
        [[96, 140], [104, 166], [102, 184]],
        [[106, 96], [114, 102], [186, 92], [166, 96], [166, 164], [194, 190]]
      ],
      "𑖑": [
        // P.116 gha: ①命點→短橫→左垂折右 ②中豎下垂折右 ③右長豎向右弧收筆
        [[82, 118], [90, 124], [114, 118], [94, 122], [94, 152], [124, 152]],
        [[134, 98], [134, 168], [168, 168]],
        [[176, 88], [176, 166], [202, 190]]
      ],
      "𑖒": [
        // P.118 ṅa: ①命點→橫畫→左斜下再向右下斜折 ②右肩長阿點半月弧
        [[96, 96], [104, 102], [168, 90], [102, 134], [144, 182]],
        [[174, 92], [164, 124], [186, 158], [202, 166]]
      ],

      // === 第二品：ca 行 (P.120-129) ===
      "𑖓": [
        // P.120 ca: ①命點→橫畫→左下斜出再向右下弧收尾 ②橫畫中心垂直下拉接底弧
        [[104, 88], [112, 94], [172, 84], [96, 126], [144, 168], [186, 190]],
        [[142, 92], [142, 164]]
      ],
      "𑖔": [
        // P.122 cha: 一筆連貫！命點→橫畫→中心下拉→左繞圓→右繞圓→下垂收筆
        [[108, 86], [116, 92], [168, 82], [140, 88], [140, 124], [94, 126], [88, 154], [136, 146], [188, 122], [192, 154], [142, 156], [146, 182], [172, 194]]
      ],
      "𑖕": [
        // P.124 ja: ①命點→橫畫→左折斜下 ②中段斜下枝 ③右肩半月弧
        [[96, 96], [104, 102], [168, 90], [96, 126], [138, 178]],
        [[124, 112], [162, 160]],
        [[174, 92], [164, 124], [186, 158], [202, 166]]
      ],
      "𑖖": [
        // P.126 jha: ①命點→橫畫→中心垂直下拉 ②底部鶯點 ③中段右折雙弧鉤
        [[104, 86], [112, 92], [166, 82], [132, 88], [132, 166]],
        [[106, 158], [144, 172], [174, 190]],
        [[134, 122], [156, 142], [172, 114], [192, 128], [184, 148]]
      ],
      "𑖗": [
        // P.128 ña: ①命點向上曲畫接橫畫→中心垂直下拉 ②底部鶯點 ③中段右折雙弧鉤
        [[106, 114], [96, 92], [168, 82], [132, 88], [132, 166]],
        [[106, 158], [144, 172], [174, 190]],
        [[134, 122], [156, 142], [172, 114], [192, 128], [184, 148]]
      ],

      // === 第三品：ṭa 行 (P.130-139) ===
      "𑖘": [
        // P.130 ṭa: ①命點起筆向左下畫半月弧至底 ②右上長阿點弧
        [[154, 94], [102, 134], [106, 174], [164, 178]],
        [[162, 92], [156, 124], [176, 154], [194, 162]]
      ],
      "𑖙": [
        // P.132 ṭha: ①命點起筆順勢畫大圓圈回起點 ②補筆密合頂端
        [[140, 88], [94, 136], [112, 184], [176, 178], [184, 124], [140, 88]],
        [[134, 92], [146, 92]]
      ],
      "𑖚": [
        // P.134 ḍa: ①命點→橫畫→左斜下彎鉤 ②垂直下拉 ③底部鶯點
        [[104, 86], [112, 92], [168, 82], [108, 124], [126, 136]],
        [[138, 108], [138, 166]],
        [[112, 160], [148, 174], [178, 190]]

    const studyPlan = [

    const modakaRules = [

      { suffixChar: "𑖺", suffixRoman: "o", idx: "09", crownName: "左右護持「之瀑流」", meaningTpl: (base) => `${base.split("（")[0]}之瀑流` },

      { suffixChar: "𑖾", suffixRoman: "aḥ", idx: "12", crownName: "右點涅槃雙露「究竟遠離」", meaningTpl: (base) => `究竟遠離（${base.split("（")[0]}）` }

    let currentStageIdx = 0;

    let currentAudio = null;

    let canvas, ctx, demoCanvas, demoCtx, isDrawing = false, demoAnimId = null;

    function initCanvas() {
      canvas = document.getElementById("traceCanvas");
      ctx = canvas.getContext("2d");
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#2c241e";

      demoCanvas = document.getElementById("demoCanvas");
      demoCtx = demoCanvas.getContext("2d");

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDraw = (e) => { stopDemo(); isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      const draw = (e) => { if (!isDrawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const endDraw = () => { isDrawing = false; };

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      window.addEventListener("mouseup", endDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", endDraw);
    }

    function stopDemo() {
      if (demoAnimId) { cancelAnimationFrame(demoAnimId); demoAnimId = null; }
      if (demoCtx) demoCtx.clearRect(0, 0, 280, 280);
    }

    function clearCanvas() {
      stopDemo();
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function setTraceItem(item) {
      currentTraceItem = item;
      clearCanvas();
      document.getElementById("watermarkChar").innerText = item.char;
      document.getElementById("traceLabel").innerHTML = `目前臨摹字帖：<b>${item.char} (${item.roman})</b> — ${item.dharma}`;
      document.getElementById("traceOrderText").innerText = item.order || "";
      const demoBtn = document.getElementById("demoBtn");
      if (strokeAnimations[item.char]) {
        demoBtn.style.display = "inline-block";
        drawStartDot(strokeAnimations[item.char][0][0]);
      } else {
        demoBtn.style.display = "none";
      }
    }

    function drawStartDot(pt) {
      if (!demoCtx || !pt) return;
      demoCtx.clearRect(0, 0, 280, 280);
      demoCtx.fillStyle = "#9e2a2b";
      demoCtx.beginPath();
      demoCtx.arc(pt[0], pt[1], 8, 0, Math.PI * 2);
      demoCtx.fill();
      demoCtx.fillStyle = "#fff";
      demoCtx.font = "bold 11px sans-serif";
      demoCtx.textAlign = "center";
      demoCtx.textBaseline = "middle";
      demoCtx.fillText("1", pt[0], pt[1]);
    }

    function playStrokeDemo() {
      if (!currentTraceItem || !strokeAnimations[currentTraceItem.char]) return;
      clearCanvas();
      const strokes = strokeAnimations[currentTraceItem.char];
      let strokeIdx = 0;
      let segIdx = 0;
      let progress = 0;

      demoCtx.lineWidth = 8;
      demoCtx.lineCap = "round";
      demoCtx.lineJoin = "round";
      demoCtx.strokeStyle = "#9e2a2b";

      function step() {
        if (strokeIdx >= strokes.length) {
          demoAnimId = null;
          return;
        }
        const pts = strokes[strokeIdx];
        if (segIdx >= pts.length - 1) {
          demoCtx.fillStyle = "#2d6a4f";
          demoCtx.beginPath();
          demoCtx.arc(pts[0][0], pts[0][1], 9, 0, Math.PI * 2);
          demoCtx.fill();
          demoCtx.fillStyle = "#fff";
          demoCtx.font = "bold 11px sans-serif";
          demoCtx.textAlign = "center";
          demoCtx.textBaseline = "middle";
          demoCtx.fillText(String(strokeIdx + 1), pts[0][0], pts[0][1]);

          strokeIdx++;
          segIdx = 0;
          progress = 0;
          setTimeout(() => { demoAnimId = requestAnimationFrame(step); }, 350);
          return;
        }

        const p1 = pts[segIdx];
        const p2 = pts[segIdx + 1];
        const nextProg = Math.min(1, progress + 0.09);

        demoCtx.beginPath();
        demoCtx.moveTo(p1[0] + (p2[0] - p1[0]) * progress, p1[1] + (p2[1] - p1[1]) * progress);
        demoCtx.lineTo(p1[0] + (p2[0] - p1[0]) * nextProg, p1[1] + (p2[1] - p1[1]) * nextProg);
        demoCtx.stroke();

        progress = nextProg;
        if (progress >= 1) {
          segIdx++;
          progress = 0;
        }
        demoAnimId = requestAnimationFrame(step);
      }

      demoAnimId = requestAnimationFrame(step);
    }

    function replayTraceAudio() {
      if (currentTraceItem && currentTraceItem.audio) playItemAudio(currentTraceItem.audio, null);
    }

    function init() {

    function renderStudyPlan() {

          `;

    function jumpToStage(idx) {

    function renderStageBar() {
      const bar = document.getElementById("stageBar");

    function loadStage(idx) {

            ${!stage.isMantra ? `<button class="mini-btn ${hasAnim ? 'cinnabar' : ''}" onclick="event.stopPropagation(); setTraceItem(${JSON.stringify(item).replace(/"/g, '&quot;')}); document.querySelector('.calligraphy-box').scrollIntoView({behavior:'smooth'}); if(${hasAnim}) setTimeout(playStrokeDemo, 400);">${hasAnim ? '▶️ 看正統筆順' : '🖌️ 硯台臨摹'}</button>` : ""}

    function setMode(mode) {
      stopAudio();
      document.getElementById("tabLearn").classList.toggle("active", mode === "learn");

    function startQuizStep(stepNum) {
      currentQuizStep = stepNum;
      document.getElementById("tabLearn").classList.remove("active");
      document.getElementById("tabQuiz").classList.add("active");
      document.getElementById("learnView").style.display = "none";
      document.getElementById("quizView").style.display = "block";
      renderStepLadder();
      buildQuizQueueForStep(stepNum);
      nextQuestion();
    }

    function renderStepLadder() {
      const ladder = document.getElementById("stepLadder");
      const stage = stages[currentStageIdx];
      const cleared = clearedStepsMap[stage.id] || [];
      const stepsInfo = [
        { num: 1, label: "🪷 第一重：字門智慧印心" },
        { num: 2, label: "🔊 第二重：聆聽梵音相應" },
        { num: 3, label: "👑 第三重：添衣加冕觀想" }
      ];
      ladder.innerHTML = "";
      stepsInfo.forEach((s) => {
        const btn = document.createElement("button");
        const isCleared = cleared.includes(s.num);
        btn.className = `step-pill ${currentQuizStep === s.num ? "active" : ""} ${isCleared ? "cleared" : ""}`;
        btn.innerText = isCleared ? `${s.label} ✓` : s.label;
        btn.onclick = () => startQuizStep(s.num);
        ladder.appendChild(btn);
      });
    }

    function buildQuizQueueForStep(stepNum) {
      const stage = stages[currentStageIdx];
      const items = stage.items;
      let questions = [];

      if (stepNum === 1) {
        items.forEach((item) => {
          questions.push({
            prompt: stage.isMantra ? "請靜心觀想，這句真言的護持功德為何？" : "請觀想此種子字的書法筆勢，它代表哪一門智慧？",
            displayChar: item.char,
            isMantraChar: !!stage.isMantra,
            audio: item.audio || null,
            correctAnswer: item.dharma,
            isCharOption: false,
            options: shuffle(pickDistractors(items, item, (x) => x.dharma)),
            explain: `<b>${item.char} (${item.roman})</b> 代表「<b>${item.dharma}</b>」。${item.brush}`
          });
        });
      } else if (stepNum === 2) {
        items.forEach((item) => {
          if (item.audio) {
            questions.push({
              prompt: "請靜心聆聽梵音，選出與此音聲相應的種子字：",
              displayChar: null,
              audio: item.audio,
              correctAnswer: item.char,
              isCharOption: true,
              options: shuffle(pickDistractors(items, item, (x) => x.char)),
              explain: `此梵音為 <b>${item.roman}（${item.char}）</b>，象徵「${item.dharma}」。`
            });
          } else {
            questions.push({
              prompt: `哪一句真言代表「${item.dharma}」？`,
              displayChar: null,
              audio: null,
              correctAnswer: item.char,
              isCharOption: true,
              options: shuffle(pickDistractors(items, item, (x) => x.char)),
              explain: `此句即為「<b>${item.dharma}</b>」（${item.roman}）。`
            });
          }
        });
      } else {
        items.forEach((item) => {
          questions.push({
            prompt: stage.isMantra ? "這句真言的梵音讀誦為何？" : "此種子字的梵音讀誦為何？",
            displayChar: item.char,
            isMantraChar: !!stage.isMantra,
            audio: item.audio || null,
            correctAnswer: item.roman,
            isCharOption: false,
            options: shuffle(pickDistractors(items, item, (x) => x.roman)),
            explain: `<b>${item.char}</b> 讀作 <b>${item.roman}</b>（${item.dharma}）。`
          });
        });

        const modakaCandidates = items.filter((it) => it.modakaBase);
        if (modakaCandidates.length > 0) {
          const baseItem = modakaCandidates[Math.floor(Math.random() * modakaCandidates.length)];
          const rule = modakaRules[Math.floor(Math.random() * modakaRules.length)];
          const combinedChar = baseItem.char + rule.suffixChar;
          const combinedRoman = baseItem.roman.slice(0, -1) + rule.suffixRoman;
          const combinedMeaning = rule.meaningTpl(baseItem.dharma);
          const mp3Path = `audio/${baseItem.modakaBase}_${rule.idx}.mp3`;
          const otherRules = shuffle(modakaRules.filter((r) => r.suffixRoman !== rule.suffixRoman)).slice(0, 3);
          const optList = shuffle([
            `${combinedRoman}（${rule.crownName}）`,
            ...otherRules.map((r) => `${baseItem.roman.slice(0, -1) + r.suffixRoman}（${r.crownName}）`)
          ]);
          questions.push({
            prompt: `本尊法身「${baseItem.char} (${baseItem.roman})」添衣加冕後如下圖，其梵音與觀想義理為何？`,
            displayChar: combinedChar,
            audio: { type: "file", file: mp3Path },
            correctAnswer: `${combinedRoman}（${rule.crownName}）`,
            isCharOption: false,
            options: optList,
            explain: `「${baseItem.char}」加上「<b>${rule.suffixChar}</b>」後，讀作 <b>${combinedRoman}</b>，意為「<b>${combinedMeaning}</b>」。`
          });
        }
      }

      quizQueue = shuffle(questions).slice(0, 5);
    }

    function pickDistractors(pool, targetItem, mapperFn) {
      const targetVal = mapperFn(targetItem);
      let others = pool.filter((x) => mapperFn(x) !== targetVal).map(mapperFn);
      if (others.length < 3) {
        stages.forEach((st) => {
          if (st.isMantra === stages[currentStageIdx].isMantra) {
            st.items.forEach((x) => {
              const val = mapperFn(x);
              if (val !== targetVal && !others.includes(val)) others.push(val);
            });
          }
        });
      }
      return [targetVal, ...shuffle(others).slice(0, 3)];
    }

    function nextQuestion() {
      stopAudio();
      answered = false;
      document.getElementById("feedbackBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      if (quizQueue.length === 0) {
        const stage = stages[currentStageIdx];
        if (!clearedStepsMap[stage.id]) clearedStepsMap[stage.id] = [];
        if (!clearedStepsMap[stage.id].includes(currentQuizStep)) {
          clearedStepsMap[stage.id].push(currentQuizStep);
          localStorage.setItem("siddham_elder_cleared_v1", JSON.stringify(clearedStepsMap));
        }
        renderStageBar();
        renderStepLadder();

        document.getElementById("qChar").style.display = "none";
        document.getElementById("qAudioBtn").style.display = "none";
        document.getElementById("optionsGrid").innerHTML = "";

        const btn = document.getElementById("nextBtn");
        btn.style.display = "block";

        if (currentQuizStep < 3) {
          const nextStep = currentQuizStep + 1;
          document.getElementById("qPrompt").innerHTML = `🪷 隨喜讚歎！本重溫習已圓滿心領神會，可繼續品讀下一重：`;
          btn.innerText = `進入下一重溫習 ➔`;
          btn.onclick = () => {
            btn.onclick = nextQuestion;
            btn.innerText = "繼續品讀下一題 ➔";
            startQuizStep(nextStep);
          };
        } else {
          const nextStageIdx = (currentStageIdx + 1) % stages.length;
          document.getElementById("qPrompt").innerHTML = `🪷 功德圓滿！「<b>${stage.title}</b>」三重靜心溫習已全部圓滿！`;
          btn.innerText = `品讀下一品：${stages[nextStageIdx].title} ➔`;
          btn.onclick = () => {
            btn.onclick = nextQuestion;
            btn.innerText = "繼續品讀下一題 ➔";
            currentQuizStep = 1;
            loadStage(nextStageIdx);
          };
        }
        return;
      }

      currentQ = quizQueue.shift();
      document.getElementById("qPrompt").innerText = currentQ.prompt;

      const qCharEl = document.getElementById("qChar");
      if (currentQ.displayChar) {
        qCharEl.style.display = "block";
        qCharEl.style.fontSize = currentQ.isMantraChar ? "2.1rem" : "4.5rem";
        qCharEl.innerText = currentQ.displayChar;
      } else {
        qCharEl.style.display = "none";
      }

      const qAudioBtn = document.getElementById("qAudioBtn");
      if (currentQ.audio) {
        qAudioBtn.style.display = "inline-block";
        if (currentQuizStep === 2) setTimeout(() => playItemAudio(currentQ.audio, null), 250);
      } else {
        qAudioBtn.style.display = "none";
      }

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";
      currentQ.options.forEach((optText) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        if (currentQ.isCharOption) btn.innerHTML = `<span class="siddham-opt" style="${stages[currentStageIdx].isMantra ? 'font-size:1.45rem;' : ''}">${optText}</span>`;
        else btn.innerText = optText;
        btn.onclick = () => checkAnswer(btn, optText);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(selectedBtn, chosenValue) {
      if (answered) return;
      answered = true;
      const isCorrect = chosenValue === currentQ.correctAnswer;
      document.querySelectorAll(".opt-btn").forEach((b) => {
        b.disabled = true;
        if (b.innerText.trim() === currentQ.correctAnswer) b.classList.add("correct");
      });
      const fb = document.getElementById("feedbackBox");
      fb.style.display = "block";
      if (isCorrect) {
        selectedBtn.classList.add("correct");
        fb.className = "feedback-box ok";
        fb.innerHTML = `🪷 <b>心領神會！</b> ${currentQ.explain}`;
        if (currentQ.audio) playItemAudio(currentQ.audio, null);
      } else {
        selectedBtn.classList.add("wrong");
        fb.className = "feedback-box err";
        fb.innerHTML = `🍵 <b>無妨，且再細品一次：</b> ${currentQ.explain}`;
        if (currentQ.audio) playItemAudio(currentQ.audio, null);
        quizQueue.splice(Math.min(2, quizQueue.length), 0, currentQ);
      }
      document.getElementById("nextBtn").style.display = "block";
    }

    function replayCurrentQuestionAudio() { if (currentQ && currentQ.audio) playItemAudio(currentQ.audio, null); }

    function playItemAudio(audioSpec, cardEl) {
      stopAudio();
      if (!audioSpec) return;
      if (cardEl) cardEl.classList.add("playing");
      currentAudio = new Audio(audioSpec.file);
      if (audioSpec.type === "range") {
        currentAudio.currentTime = audioSpec.start;
        currentAudio.play().catch((e) => console.warn("音檔播放失敗:", e));
        currentAudio.addEventListener("timeupdate", () => { if (currentAudio && currentAudio.currentTime >= audioSpec.end) stopAudio(); });
      } else {
        currentAudio.play().catch((e) => console.warn("音檔播放失敗:", e));
      }
      currentAudio.onended = () => stopAudio();
    }

    function stopAudio() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      document.querySelectorAll(".learn-card.playing").forEach((c) => c.classList.remove("playing"));
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    init();
  </script>
</body>
</html>
